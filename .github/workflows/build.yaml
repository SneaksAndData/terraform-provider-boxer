name: Run tests with coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate_commit:
    name: Validate Code and Publish Coverage
    runs-on: ubuntu-latest
    if: ${{ github.ref != 'refs/heads/main' }}
    permissions:
      id-token: write      # required for dependabot PRs
      pull-requests: write # required for dependabot PRs
      contents: read       # required for dependabot PRs
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.*'

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: 'kind'
          config: integration_tests/kind.yaml

      - name: Check kind cluster
        run: |
          kubectl cluster-info
          kubectl get nodes
          kind get kubeconfig --name kind

      - name: Deploy Ingress NGINX Controller
        run: kubectl apply -f https://kind.sigs.k8s.io/examples/ingress/deploy-ingress-nginx.yaml

#      - name: Deploy apps
#        run: kubectl apply -f https://kind.sigs.k8s.io/examples/ingress/usage.yaml

      - name: Install integration test dependencies
        run: |
          helm dependency build ./integration_tests/helm/setup
          helm install --namespace default integration-tests integration_tests/helm/setup \
            --set boxer-issuer.issuer.replicas=1 \
            --set boxer-validator-nginx.validator.replicas=1

      - name: Wait for apps to be ready
        run: |
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=boxer-issuer --timeout=120s
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=boxer-validator-nginx --timeout=120s

      - name: Wait for service
        run: |
          for i in {1..30}; do
            if curl --silent http://localhost:55555/foo; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Get logs from application pods
        if: always()
        run: |
          kubectl logs -l app=foo || true
          kubectl logs -l app=bar || true
          kubectl logs -l app.kubernetes.io/name=boxer-issuer || true
          kubectl logs -l app.kubernetes.io/name=boxer-validator-nginx || true

      - name: Check Format
        run: gofmt -d ./

      - name: Verify dependencies
        run: go mod verify

      - name: Install dependencies
        run: go mod vendor

      - name: Run go vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.0
