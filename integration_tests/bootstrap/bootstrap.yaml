  name: root
  namespace: default
spec:
  active: true
  oidc:
    audiences:
      - https://kubernetes.default.svc.cluster.local
    discoveryUrl: https://kubernetes.default.svc.cluster.local
    issuers:
      - https://kubernetes.default.svc.cluster.local
    userIdClaim: sub
---
apiVersion: auth.sneaksanddata.com/v1beta1
kind: ExternalIdentityDocument
